services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-allsafe}
      MYSQL_USER: ${DB_USER:-allsafe}
      MYSQL_PASSWORD: ${DB_PASSWORD:?definir en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?definir en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_URL: redis://redis:6379/0
      SLA_SCHEDULER_MODE: "off"
      COLLECT_STATIC: "true"
      # Los hooks de IA fire-and-forget se encolan en Celery (servicio `worker`),
      # no en el thread in-process. Ver `worker` más abajo.
      AI_TASK_QUEUE: celery
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  scheduler:
    build: ./backend
    command: python manage.py check_sla --loop
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "false"
    depends_on:
      web:
        condition: service_healthy

  trial-scheduler:
    build: ./backend
    command: python manage.py check_trials --loop
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "false"
    depends_on:
      web:
        condition: service_healthy

  worker:
    # Worker de Celery: consume la cola `allsafe` y ejecuta los hooks de IA async
    # (auto-triage, sentimiento, sugerencia de KB, ingesta omnicanal). Sin esto,
    # con AI_TASK_QUEUE=celery los mensajes se encolan pero nadie los procesa.
    build: ./backend
    command: celery -A config worker -l info -Q allsafe --concurrency=2
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_URL: redis://redis:6379/0
      AI_TASK_QUEUE: celery
      RUN_MIGRATIONS: "false"   # las migraciones las corre `web` en su arranque
      COLLECT_STATIC: "false"
    depends_on:
      web:
        condition: service_healthy   # espera migraciones aplicadas
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/staticfiles:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  mysql_data:
  static_volume:
  media_volume:
